[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-diagram-tools"
version = "0.1.0"
description = "Build text diagrams from XML and export Markdown diagrams to PNG"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.scripts]
diagram-build = "text_diagram:_main"
diagram-export = "render_diagrams:main"

[tool.setuptools]
py-modules = ["text_diagram", "render_diagrams"]
